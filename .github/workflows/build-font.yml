name: Build Romanized Chinese Font
on: [push, workflow_dispatch]

jobs:
  build-font:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: { python-version: '3.10' }
      
    - name: Install & Run
      run: |
        pip install fonttools
        # 只检查本地文件，不联网下载
        echo "云端已收到本地字体，大小如下："
        ls -lh SourceHanSerif.ttf
        
        # 直接运行雕刻脚本
        python romanize_font.py
        
    - uses: actions/upload-artifact@v4
      with:
        name: Max-Roman-Font
        path: Max_Font_Cloud.ttf
