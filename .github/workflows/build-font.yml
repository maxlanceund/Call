name: Build Romanized Chinese Font
on: [push, workflow_dispatch]
jobs:
  build-font:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: { python-version: '3.10' }
    - name: Install & Run
      run: |
        pip install fonttools brotli
        curl -L -o SourceHanSans.ttf "https://github.com/google/fonts/raw/main/ofl/zcoolxiaowei/ZCOOLXiaoWei-Regular.ttf"
        python romanize_font.py
    - uses: actions/upload-artifact@v4
      with:
        name: Max-Roman-Font
        path: Max_Roman_Stone.ttf
