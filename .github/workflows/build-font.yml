name: Build Romanized Chinese Font
on: [push, workflow_dispatch]

jobs:
  build-font:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with: { python-version: '3.10' }
      
    - name: Install & Run
      run: |
        pip install fonttools
        # 🚨 换成 jsDelivr 加速源，下载极稳的站酷小薇体
        curl -fL -o SourceHanSerif.ttf "https://fastly.jsdelivr.net/gh/google/fonts@main/ofl/zcoolxiaowei/ZCOOLXiaoWei-Regular.ttf"
        
        # 打印一下文件大小，让你知道到底下没下来
        echo "字体文件大小:"
        ls -lh SourceHanSerif.ttf
        
        # 运行造字脚本
        python romanize_font.py
        
    - uses: actions/upload-artifact@v4
      with:
        name: Max-Roman-Font
        path: Max_Font_Cloud.ttf
