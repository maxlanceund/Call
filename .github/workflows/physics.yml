name: Run Neutron Star Simulation Data

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  run-physics:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy scipy

    - name: Run simulation
      run: python tov_simulation.py

    - name: Commit and push the result data
      uses: stefanzweifel/git-auto-commit-action@v4
      with:
        commit_message: "Auto-generated CSV data from GitHub Actions"
        file_pattern: '*.csv'
