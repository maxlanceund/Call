name: Run Black Hole Information Erasure Experiment

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  run-experiment:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy matplotlib
    - name: Run simulation
      run: python experiment_erasure.py
    - name: Upload results
      uses: actions/upload-artifact@v3
      with:
        name: physics-experiment-results
        path: entropy_erasure_results.png
