name: Run Black Hole Information Erasure Experiment

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  run-experiment:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 赋予向仓库写入内容的权限

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install numpy matplotlib

    - name: Run simulation
      run: python experiment_erasure.py

    - name: Auto-commit and push the generated image
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add entropy_erasure_results.png
        git commit -m "Auto-generated: Updated black hole erasure simulation results" || echo "No changes to commit"
        git push
