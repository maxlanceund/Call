name: DE-Sim Cloud Run

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: 

jobs:
  run-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 30 # 🚨 强制卡死在30分钟以内
    steps:
    - name: Checkout repository
      uses: actions/checkout@v3
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        
    - name: Run Monte Carlo Simulation
      run: python monte_carlo_sim.py
