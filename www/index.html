<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
    <title>Max FPS</title>
    <style>
        body { margin: 0; overflow: hidden; background: #111; touch-action: none; }
        #ui { position: absolute; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; }
        button { background: rgba(255,255,255,0.2); border: 1px solid white; color: white; padding: 15px; border-radius: 50%; font-size: 16px; }
    </style>
    <!-- 引入 Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>
    <div id="ui">
        <button id="shootBtn">开火</button>
        <button id="swapBtn">切刀</button>
    </div>
    <script>
        // 1. 初始化场景
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x222222);
        scene.fog = new THREE.Fog(0x222222, 10, 50);

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. 搭建靶场（几何地板和墙壁）
        const floorGeo = new THREE.PlaneGeometry(50, 50);
        const floorMat = new THREE.MeshBasicMaterial({ color: 0x555555, wireframe: true });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        scene.add(floor);

        // 3. 生成靶子
        const targets = [];
        for(let i=0; i<5; i++) {
            const geo = new THREE.SphereGeometry(0.5, 16, 16);
            const mat = new THREE.MeshBasicMaterial({ color: 0xff0000 });
            const sphere = new THREE.Mesh(geo, mat);
            sphere.position.set((Math.random()-0.5)*10, 1.5, -5 - Math.random()*10);
            scene.add(sphere);
            targets.push(sphere);
        }

        // 4. 用几何体拼一把 USP（简单的方块组合）
        const gunGroup = new THREE.Group();
        const barrel = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.1, 0.5), new THREE.MeshBasicMaterial({color: 0x888888}));
        const handle = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.3, 0.1), new THREE.MeshBasicMaterial({color: 0x333333}));
        handle.rotation.x = Math.PI / 6;
        handle.position.set(0, -0.2, 0.1);
        gunGroup.add(barrel, handle);
        gunGroup.position.set(0.3, -0.3, -0.5);
        camera.add(gunGroup);

        // 5. 拼一把红色蝴蝶刀
        const knifeGroup = new THREE.Group();
        const blade = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.3, 0.05), new THREE.MeshBasicMaterial({color: 0xdddddd}));
        const handleKnife = new THREE.Mesh(new THREE.BoxGeometry(0.05, 0.1, 0.05), new THREE.MeshBasicMaterial({color: 0xff0000}));
        handleKnife.position.y = -0.2;
        knifeGroup.add(blade, handleKnife);
        knifeGroup.position.set(0.3, -0.3, -0.5);
        knifeGroup.visible = false;
        camera.add(knifeGroup);
        
        scene.add(camera);

        // 6. 视角控制（移动端滑动）
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        document.addEventListener('touchstart', (e) => {
            isDragging = true;
            previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        });
        document.addEventListener('touchmove', (e) => {
            if (isDragging) {
                const deltaX = e.touches[0].clientX - previousMousePosition.x;
                const deltaY = e.touches[0].clientY - previousMousePosition.y;
                camera.rotation.y -= deltaX * 0.005;
                camera.rotation.x -= deltaY * 0.005;
                camera.rotation.x = Math.max(-Math.PI/2, Math.min(Math.PI/2, camera.rotation.x));
                previousMousePosition = { x: e.touches[0].clientX, y: e.touches[0].clientY };
            }
        });
        document.addEventListener('touchend', () => isDragging = false);

        // 7. 核心逻辑：射线开火
        const raycaster = new THREE.Raycaster();
        document.getElementById('shootBtn').addEventListener('click', () => {
            if (!gunGroup.visible) return; // 切刀状态不能开枪
            raycaster.setFromCamera(new THREE.Vector2(0, 0), camera); // 从屏幕中心(准星)发射
            const intersects = raycaster.intersectObjects(targets);
            
            if (intersects.length > 0) {
                // 打中靶子，直接删除（爆头消失）
                scene.remove(intersects[0].object);
                targets.splice(targets.indexOf(intersects[0].object), 1);
            }
        });

        // 8. 切刀逻辑
        document.getElementById('swapBtn').addEventListener('click', () => {
            gunGroup.visible = !gunGroup.visible;
            knifeGroup.visible = !knifeGroup.visible;
        });

        // 9. 渲染循环
        function animate() {
            requestAnimationFrame(animate);
            renderer.render(scene, camera);
        }
        animate();

        // 适配屏幕缩放
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
